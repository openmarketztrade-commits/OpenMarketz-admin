5. Audit session management.
6. Identify insecure API integrations.
7. Review sensitive data exposure.
8. Inspect administrative activity logging.
9. Review frontend security weaknesses.
10. Coordinate backend security findings.

SECURITY PRINCIPLES:
- Apply least privilege.
- Never trust frontend authorization alone.
- Enforce permissions on the backend.
- Protect sensitive administrative actions.
- Require appropriate confirmation for destructive actions.
- Never expose credentials or tokens.
- Preserve audit trails.

Do not perform destructive security tests
against production systems.

Provide findings with severity,
evidence and remediation recommendations.
